# pi-fan Configuration — intake + exhaust + heatsink (on/off only, no speed control)
# Edit and apply: sudo systemctl restart pi-fan

# BCM GPIO driving each MOSFET module's SIG pin.
# 2026-08-05 rewire, corrected twice same day (see fan_control.py's
# docstring for the full history). Final: intake 18→17, exhaust 13→27
# (moved despite already being wired and working — all three are being
# grouped together physically), heatsink new on 22. All three are
# general-purpose GPIO with no default alternate peripheral function —
# confirmed via config.txt and live gpioinfo before reassigning.
FAN_INTAKE_GPIO=17
FAN_EXHAUST_GPIO=27
FAN_HEATSINK_GPIO=22

# 1 = on, 0 = off. This is all there is now — speed control (PWM) was
# dropped since it isn't needed; see ../README.md for why.
#
# All three default OFF: none of these pins are physically wired yet as
# of this update (exhaust's previous wiring on GPIO13 is being relocated,
# not left in place) — nothing here should be assumed live. Flip to 1 and
# restart once Eli confirms a given fan is actually connected.
FAN_INTAKE_ENABLED=0
FAN_EXHAUST_ENABLED=0
FAN_HEATSINK_ENABLED=0
